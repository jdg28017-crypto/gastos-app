<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Gastos compartidos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--fondo:#f6f7f6;--tarjeta:#fff;--texto:#1c2421;--suave:#5f6b66;--acento:#1f6f5c;--linea:#dde3e0;--rojo:#b3261e}
@media (prefers-color-scheme:dark){:root{--fondo:#121614;--tarjeta:#1b211e;--texto:#e8eeea;--suave:#9aa7a1;--acento:#4cb89d;--linea:#2c3531;--rojo:#f2796f}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.4 system-ui,sans-serif;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{padding:calc(16px + env(safe-area-inset-top)) 0 8px}
h1{font-size:18px;margin:0}
.sub{color:var(--suave);font-size:14px}
.saldo{background:var(--acento);color:#fff;border-radius:14px;padding:16px;margin:12px 0}
.saldo b{font-size:26px;display:block}
.fila{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;justify-content:space-between}
.fila .c{min-width:0}.fila .c div:first-child{overflow-wrap:anywhere}
.fila .i{font-weight:600;white-space:nowrap}.neg{color:var(--rojo)}
.chip{font-size:12px;color:var(--suave)}
form{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:14px;margin:12px 0}
label{display:block;font-size:14px;color:var(--suave);margin:10px 0 4px}
input,select,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--linea);background:var(--fondo);color:var(--texto)}
button{background:var(--acento);color:#fff;border:0;font-weight:600;margin-top:14px}
button.sec{background:transparent;color:var(--acento);border:1px solid var(--acento)}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 4px 14px #0004}
#msg{min-height:1.4em;color:var(--rojo);font-size:14px}
.oculto{display:none}
</style>
</head>
<body>
<header><h1>Gastos compartidos</h1><div class="sub" id="quien"></div></header>

<main id="vista-alta" class="oculto">
  <p>Este móvil todavía no está dado de alta. Escribe el código de alta que te ha dado Juan.</p>
  <form id="form-alta" autocomplete="off">
    <label for="f-enlace">Código de alta (p. ej. K7M2-9QXD)</label>
    <input id="f-enlace" required autocapitalize="characters" autocorrect="off" spellcheck="false">
    <div id="msg-alta" role="alert" style="color:var(--rojo);min-height:1.4em"></div>
    <button type="submit">Dar de alta este móvil</button>
  </form>
</main>

<main id="vista-lista" class="oculto">
  <div class="saldo"><span id="periodo"></span><b id="saldo"></b><span id="totales"></span></div>
  <div id="lista"></div>
</main>
<button class="fab oculto" id="nuevo" type="button">Apuntar gasto</button>

<main id="vista-form" class="oculto">
  <form id="form" autocomplete="off">
    <label for="f-concepto">Concepto (comercio y detalle)</label>
    <input id="f-concepto" required maxlength="200" placeholder="Ahorramás (compra comida)">
    <label for="f-importe">Importe imputado (€; negativo = devolución)</label>
    <input id="f-importe" required inputmode="decimal" placeholder="12,50 o 65,8-6,6">
    <label for="f-fecha">Fecha</label>
    <input id="f-fecha" type="date" required>
    <label for="f-reparto">Reparto</label>
    <select id="f-reparto"><option value="50/50">50 / 50</option><option value="100-otro">100 % del otro</option></select>
    <div id="msg" role="alert"></div>
    <button type="submit" id="guardar">Guardar</button>
    <button type="button" class="sec" id="cancelar">Cancelar</button>
  </form>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
